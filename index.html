<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fullcom</title>
<style>
* {box-sizing:border-box;}
body {margin:0; font-family:Arial, sans-serif; background:#101114; color:#fff;}
header {background:#1c1d22; padding:20px; text-align:center; font-size:22px; font-weight:bold; border-bottom:1px solid #333;}
.chat {height:calc(100dvh - 150px); overflow-y:auto; padding:20px;}
.message {padding:14px; margin-bottom:12px; border-radius:15px; max-width:85%; line-height:1.5; overflow-wrap:anywhere;}
.bot {background:#292b33; margin-right:auto;}
.user {background:#176b4d; margin-left:auto;}
.input-area {position:fixed; bottom:0; width:100%; background:#1c1d22; padding:15px; display:flex; gap:10px;}
input {flex:1; min-width:0; padding:14px; border-radius:12px; border:none; outline:none; font-size:16px;}
button {background:#21a675; color:#fff; border:none; padding:14px; border-radius:12px; font-size:16px; cursor:pointer;}
</style>
</head>
<body>
<header>fullcom</header>
<div class="chat" id="chat">
  <div class="message bot">
    Приветствую, 😎 Сайт работает. Скоро все настроим </div>
</div>
<div class="input-area">
  <input id="message" type="text" placeholder="Напиши сообщение...">
  <button onclick="sendMessage()">➤</button>
</div>
<script>
const input = document.getElementById('message');
const chat = document.getElementById('chat');

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value =  '';
  setTimeout(() => {
    addMessage('Братан, сообщение получил! 😎 Пока работаю в тестовом режиме, скоро подключим настоящие мозги.', 'bot');
  }, 500);
}
input.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') {
    sendMessage();
  }
});
</script>
</body>
</html>`
